services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fronteira
      POSTGRES_PASSWORD: fronteira
      POSTGRES_DB: fronteira
    ports:
      - "5432:5432"
    volumes:
      - fronteira_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fronteira"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://fronteira:fronteira@db:5432/fronteira
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/srv
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

volumes:
  fronteira_db_data:
