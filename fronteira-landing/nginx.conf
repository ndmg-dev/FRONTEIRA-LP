server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml font/woff2;

    # SPA de página única, sem router — todo path cai em index.html.
    location / {
        try_files $uri /index.html;
    }

    location = /robots.txt {
        access_log off;
    }

    # Assets versionados pelo Vite (hash no nome) podem cachear "para sempre".
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
}
